<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alec's Recipe Book Management (Async CRUD)</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
    }
    
    
    .container {
      display: flex;
      gap: 20px;
    }
    .left-panel {
      flex: 1;
      background: white;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .right-panel {
      flex: 1.5;
      background: white;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    
    input, textarea, button {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled {
      background-color: #888;
    }

    
    #status-box {
      padding: 10px;
      margin-bottom: 15px;
      display: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .loading { background-color: #ffffcc; color: #666000; border: 1px solid #e6e600; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* Recipe card styling */
    .recipe-card {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    .recipe-card h3 {
      margin-top: 0;
    }
    .btn-edit {
      background-color: #ffc107;
      color: black;
      width: auto;
      margin-right: 5px;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
      width: auto;
    }
  </style>
</head>
<body>

  <h1>Alec's Recipe Book Management</h1>

  
  <div id="status-box"></div>

  <div class="container">
    
    <div class="left-panel">
      <h2 id="form-title">Add New Recipe</h2>
      <form id="recipe-form">
        <input type="hidden" id="edit-id">
        <input type="text" id="recipe-name" placeholder="Recipe Name" required>
        <textarea id="recipe-steps" placeholder="Ingredients / Steps" rows="5" required></textarea>
        <button type="submit" id="save-btn">Add Recipe (POST)</button>
        <button type="button" id="cancel-btn" style="background-color: #6c757d; display: none;">Cancel</button>
      </form>
    </div>

    <div class="right-panel">
      <h2>All Recipes (GET)</h2>
      <div id="recipes-container"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
